name: Build Release Packages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v1.0.0)
        required: true
        default: v1.0.0
      release_name:
        description: GitHub release name
        required: true
        default: Quack Kitchen 1.0.0

permissions:
  contents: read

env:
  VCPKG_COMMIT: 2d6a6cf3ac9a7cc93942c3d289a2f9c661a6f4a7
  LINUXDEPLOY_VERSION: 1-alpha-20251107-1
  LINUXDEPLOY_SHA256: c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d

jobs:
  windows-installer:
    name: Windows installer
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: Build/windows-release/vcpkg_installed
          key: windows-vcpkg-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}

      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git vcpkg
          git -C vcpkg checkout $env:VCPKG_COMMIT
          & .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          "VCPKG_ROOT=$((Resolve-Path .\vcpkg).Path)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Validate and build
        shell: pwsh
        run: |
          python tools/validate_assets.py
          cmake --preset windows-release
          $buildOutput = @(& cmake --build --preset windows-release --parallel 2>&1)
          $buildExitCode = $LASTEXITCODE
          $buildOutput | ForEach-Object { Write-Host "$_" }
          if ($buildExitCode -ne 0) {
            $errorLines = @($buildOutput | Select-String -Pattern '(^|: )(fatal error|error (C|LNK|MSB)[0-9]+)')
            if ($errorLines.Count -eq 0) {
              $errorLines = @($buildOutput | Select-Object -Last 20)
            }
            $errorLines | Select-Object -Last 20 | ForEach-Object {
              $message = "$_".Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::error::$message"
            }
            exit $buildExitCode
          }
          ctest --test-dir Build/windows-release --output-on-failure

      - name: Stage game files
        shell: pwsh
        run: |
          cmake --install Build/windows-release --prefix Installer/GAMEDIRECTORY
          python tools/verify_release.py Installer/GAMEDIRECTORY --platform windows

      - name: Verify GUI subsystem and version metadata
        shell: pwsh
        run: |
          $exe = "Installer\GAMEDIRECTORY\Quack Kitchen.exe"
          $headers = & dumpbin /headers $exe
          $subsystem = $headers | Select-String -Pattern 'subsystem \(Windows' | Select-Object -First 1
          if ($subsystem -notmatch 'Windows GUI') {
            throw "Release executable is not a Windows GUI application."
          }
          $version = (Get-Item $exe).VersionInfo
          if ($version.ProductName -ne "Quack Kitchen" -or $version.ProductVersion -ne "1.0.0") {
            throw "Unexpected executable version metadata: $($version | Format-List | Out-String)"
          }

      - name: Smoke-test staged Windows executable and runtime layout
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\quack-kitchen-data"
          $executable = (Resolve-Path "Installer\GAMEDIRECTORY\Quack Kitchen.exe").Path
          $process = Start-Process -FilePath $executable -ArgumentList "--headless-smoke-test" -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw "Quack Kitchen smoke test timed out."
          }
          if ($process.ExitCode -ne 0) {
            Write-Host "::error::Quack Kitchen headless smoke test exited with code $($process.ExitCode)."
            throw "Quack Kitchen smoke test exited with code $($process.ExitCode)."
          }

      - name: Download required Visual C++ runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force Installer\REDIST | Out-Null
          Invoke-WebRequest -Uri https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile Installer\REDIST\VC_redist.x64.exe
          if ((Get-Item Installer\REDIST\VC_redist.x64.exe).Length -lt 10MB) {
            throw "Downloaded Visual C++ runtime is unexpectedly small."
          }

      - name: Compile Inno Setup installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" Installer\InstallScript.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = Get-Item Installer\INSTALLER\Quack_Kitchen_1.0.0_Setup.exe
          if ($installer.Length -ge 500MB) {
            throw "Installer exceeds the 500 MB DigiPen limit."
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: quack-kitchen-windows
          path: Installer/INSTALLER/Quack_Kitchen_1.0.0_Setup.exe
          if-no-files-found: error

  linux-packages:
    name: Linux AppImage and Flatpak
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake curl file flatpak flatpak-builder g++ imagemagick \
            libfreetype-dev libglew-dev libglfw3-dev libgl1-mesa-dri \
            ninja-build python3 xauth xvfb

      - name: Validate and build
        run: |
          python3 tools/validate_assets.py
          appstreamcli validate --pedantic --no-net \
            packaging/linux/edu.digipen.quackkitchen.metainfo.xml
          cmake --preset linux-release
          cmake --build --preset linux-release --parallel
          ctest --test-dir Build/linux-release --output-on-failure

      - name: Download linuxdeploy
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_VERSION}/linuxdeploy-x86_64.AppImage" \
            --output Build/linuxdeploy-x86_64.AppImage
          echo "${LINUXDEPLOY_SHA256}  Build/linuxdeploy-x86_64.AppImage" | sha256sum --check --strict
          chmod +x Build/linuxdeploy-x86_64.AppImage

      - name: Build AppImage
        env:
          LINUXDEPLOY: ${{ github.workspace }}/Build/linuxdeploy-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: tools/package_linux.sh

      - name: Verify staged release and smoke-test AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          QUACK_KITCHEN_SKIP_STARTUP_BUDGET: '1'
          XDG_DATA_HOME: ${{ runner.temp }}/quack-kitchen-appimage-data
        run: |
          python3 tools/verify_release.py Build/linux-package/AppDir/usr/bin --platform linux
          timeout 60s xvfb-run -a Build/linux-package/Quack_Kitchen-1.0.0-x86_64.AppImage --smoke-test

      - name: Install Flatpak runtime
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub \
            org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08

      - name: Build and bundle Flatpak
        run: |
          flatpak-builder --user --force-clean Build/flatpak-build \
            packaging/linux/edu.digipen.quackkitchen.yml
          flatpak build-export --disable-sandbox \
            Build/flatpak-repository Build/flatpak-build stable
          flatpak build-bundle \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            Build/flatpak-repository \
            Build/linux-package/Quack_Kitchen-1.0.0-x86_64.flatpak \
            edu.digipen.quackkitchen stable

      - name: Smoke-test Flatpak bundle
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          XDG_DATA_HOME: ${{ runner.temp }}/quack-kitchen-flatpak-data
        run: |
          flatpak install --user --noninteractive \
            Build/linux-package/Quack_Kitchen-1.0.0-x86_64.flatpak
          timeout 60s xvfb-run -a flatpak run \
            --env=QUACK_KITCHEN_SKIP_STARTUP_BUDGET=1 \
            edu.digipen.quackkitchen --smoke-test

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: quack-kitchen-linux
          path: |
            Build/linux-package/Quack_Kitchen-1.0.0-x86_64.AppImage
            Build/linux-package/Quack_Kitchen-1.0.0-x86_64.flatpak
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: github.event_name == 'workflow_dispatch'
    needs: [windows-installer, linux-packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: quack-kitchen-windows
          path: release-files

      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          name: quack-kitchen-linux
          path: release-files

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.release_name }}
          generate_release_notes: true
          files: release-files/*
