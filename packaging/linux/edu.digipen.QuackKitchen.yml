app-id: edu.digipen.QuackKitchen
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: quack-kitchen

finish-args:
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --socket=pulseaudio

modules:
  - name: quack-kitchen
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin /app/lib /app/share/applications /app/share/icons/hicolor/256x256/apps
      - cp -a usr/bin/. /app/bin/
      - if test -d usr/lib; then cp -a usr/lib/. /app/lib/; fi
      - install -Dm644 edu.digipen.QuackKitchen.desktop /app/share/applications/edu.digipen.QuackKitchen.desktop
      - install -Dm644 edu.digipen.QuackKitchen.png /app/share/icons/hicolor/256x256/apps/edu.digipen.QuackKitchen.png
    sources:
      - type: dir
        path: ../../Build/linux-package/AppDir
      - type: file
        path: edu.digipen.QuackKitchen.desktop
      - type: file
        path: edu.digipen.QuackKitchen.png
