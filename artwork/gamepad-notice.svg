<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#000000"/>
  <g font-family="Noto Sans, sans-serif" text-anchor="middle">
    <text x="640" y="120" font-size="58" font-weight="700" fill="#ffffff">GAMEPAD SUPPORTED</text>
    <text x="640" y="172" font-size="24" fill="#d7b36a">Xbox-style button labels</text>

    <g font-size="31" fill="#ffffff">
      <text x="640" y="260">LEFT STICK / D-PAD — MOVE</text>
      <text x="640" y="315">X — PICK UP OR INTERACT</text>
      <text x="640" y="370">A — USE, CHOP, OR SELECT</text>
      <text x="640" y="425">START — PAUSE</text>
      <text x="640" y="480">Y — SETTINGS DURING GAMEPLAY</text>
    </g>

    <text x="640" y="570" font-size="27" fill="#d7b36a">Menus: D-pad or either stick to navigate</text>
    <text x="640" y="612" font-size="27" fill="#d7b36a">A to select • B to go back</text>
  </g>
</svg>
