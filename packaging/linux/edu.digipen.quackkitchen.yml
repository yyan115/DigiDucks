app-id: edu.digipen.quackkitchen
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: quack-kitchen

finish-args:
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --socket=pulseaudio

modules:
  - name: quack-kitchen
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin /app/lib /app/share/applications /app/share/icons/hicolor/256x256/apps /app/share/metainfo
      - cp -a usr/bin/. /app/bin/
      - if test -d usr/lib; then cp -a usr/lib/. /app/lib/; fi
      - install -Dm644 usr/share/applications/edu.digipen.quackkitchen.desktop /app/share/applications/edu.digipen.quackkitchen.desktop
      - install -Dm644 usr/share/icons/hicolor/256x256/apps/edu.digipen.quackkitchen.png /app/share/icons/hicolor/256x256/apps/edu.digipen.quackkitchen.png
      - install -Dm644 usr/share/metainfo/edu.digipen.quackkitchen.appdata.xml /app/share/metainfo/edu.digipen.quackkitchen.metainfo.xml
    sources:
      - type: dir
        path: ../../Build/linux-package/AppDir
